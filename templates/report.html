{% extends 'base.html' %}{% block title %}Сформировать отчет — Трекер{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card-custom"><h3 class="fw-bold mb-3">Сформировать отчет</h3><p class="text-secondary">Отчет по текущей ситуации за выбранный период. Период — не более двух месяцев.</p><form action="{{ url_for('main.generate_report') }}" method="GET"><div class="row g-3"><div class="col-md-6"><label class="form-label">Начало периода</label><input type="date" name="start" class="form-control-custom" required></div><div class="col-md-6"><label class="form-label">Конец периода</label><input type="date" name="end" class="form-control-custom" required></div></div><div class="d-flex gap-2 mt-4"><button name="format" value="xlsx" class="btn-primary-custom">Excel</button><button name="format" value="pdf" class="btn-secondary-custom">PDF</button></div></form></div></div></div>{% endblock %}

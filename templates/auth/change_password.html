{% extends 'base.html' %}
{% block title %}Принудительная смена пароля — Трекер{% endblock %}
{% block content %}
<div class="forced-password-screen">
  <div class="forced-password-window card-custom">
    <div class="forced-password-icon">!</div>
    <h4 class="fw-bold mb-2">Требуется смена пароля</h4>
    <p class="text-secondary small mb-4">Это первый вход или администратор потребовал сменить пароль. Для продолжения работы необходимо задать новый пароль.</p>
    <form method="POST">
      <label class="form-label small fw-semibold text-secondary">Текущий пароль</label><input type="password" name="old_password" class="form-control-custom mb-3" required autofocus>
      <label class="form-label small fw-semibold text-secondary">Новый пароль</label><input type="password" name="new_password" class="form-control-custom mb-3" required>
      <label class="form-label small fw-semibold text-secondary">Повторите новый пароль</label><input type="password" name="confirm_password" class="form-control-custom mb-4" required>
      <button class="btn-primary-custom w-100 justify-content-center">Сменить пароль и продолжить</button>
    </form>
  </div>
</div>
{% endblock %}
